[tools]
bun = "1.4.4"
node = "24.22.1"
hk = "2.8.1"
pkl = "0.32.2"
typos = "1.51.1"
betterleaks = "1.9.0"
actionlint = "1.7.12"
zizmor = "1.31.1"
hadolint = "2.15.1"
shellcheck = "0.11.0"
"github:agent-sh/agnix" = "0.59.3"

[tasks.deps]
description = "Install dependencies of every package"
run = "for d in health-monitor host-runner linear-connector robot-fastify-backend telegram-frontend web-variations-frontend; do (cd $d && bun install); done"

[tasks.setup]
description = "Install dependencies and the git hooks"
depends = ["deps"]
run = "hk install"

[tasks.check]
description = "Run every check, the same set CI runs"
depends = ["deps"]
run = "hk check --all"

[tasks.fix]
description = "Apply the automatic fixes"
run = "hk fix --all"
