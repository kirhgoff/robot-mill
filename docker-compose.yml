x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── Backend: agent orchestration server ──────────────────────────────────────
  backend:
    build: .
    image: pi-agent:latest
    restart: unless-stopped
    init: true
    logging: *default-logging
    command: ["bun", "run", "/home/agent/backend/src/index.ts"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: production
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_API_KEY_BACKEND: ${OPENROUTER_API_KEY_BACKEND:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HOST_RUNNER_URL: ${HOST_RUNNER_URL:-http://host.docker.internal:3200}
      HEALTH_URL: ${HEALTH_URL:-http://host.docker.internal:3300}
      LINEAR_URL: ${LINEAR_URL:-http://host.docker.internal:3400}
      VARIATIONS_ENABLED: ${VARIATIONS_ENABLED:-false}
      PI_PROVIDER: ${PI_PROVIDER}
      PI_MODEL: ${PI_MODEL}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL}
      GIT_USER_NAME: ${GIT_USER_NAME}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "3100"
      WORKSPACE: /workspace
      SESSION_STORAGE: /data/agent-sessions
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TARGET_DATA_DIR: /data/target
    ports:
      - "${BACKEND_PORT}:3100"
      # Homepage: serve the console (Poop House by default) on the site root.
      - "${HOMEPAGE_PORT:-80}:3100"
    volumes:
      - ./data/workspace:/workspace
      - ./data/pi-home:/home/agent/.pi
      - ./data/agent-sessions:/data/agent-sessions
      - ./data/target:/data/target

  # ── Telegram frontend ───────────────────────────────────────────────────────
  telegram:
    profiles: ["telegram"]
    build: .
    image: pi-agent:latest
    restart: unless-stopped
    init: true
    logging: *default-logging
    command: ["bun", "run", "/home/agent/telegram-frontend/src/index.ts"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ALLOWED_CHAT_IDS: ${ALLOWED_CHAT_IDS}
      HOST_RUNNER_URL: ${HOST_RUNNER_URL:-http://host.docker.internal:3200}
      HOST_RUNNER_WS_URL: ${HOST_RUNNER_WS_URL:-ws://host.docker.internal:3200/ws}
      LINEAR_URL: ${LINEAR_URL:-http://host.docker.internal:3400}
      STATE_FILE: /data/telegram/state.json
    volumes:
      - ./data/telegram:/data/telegram
